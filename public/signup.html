<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create an account — Meher Kapoor Makeup</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="/" class="brand">Meher Kapoor</a>
    <div class="nav-actions"><a href="/login.html" class="btn btn-ghost">Log in</a></div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Save your favorite looks and speed up future bookings.</p>
    <form id="signupForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="6" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Create account</button>
      <p class="auth-error" id="signupError"></p>
    </form>
    <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('signupError');
    errorEl.classList.remove('show');

    const payload = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    };

    try {
      const { token, user } = await Auth.apiFetch('/api/auth/signup', {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      Auth.setSession(token, user);
      window.location.href = '/';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add('show');
    }
  });
</script>
</body>
</html>
